<!DOCTYPE html>
<html>
<head>
    <title>RAG Document Q&A</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;}
        button:hover { background: #0056b3; }
        #response { margin-top: 20px; padding: 10px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap;}
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>RAG Document QA System (Groq)</h2>

        <div id="auth-section">
            <h3>Login</h3>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>

        <div id="app-section" class="hidden">
            <h3>Upload Document</h3>
            <input type="file" id="fileInput" accept=".pdf">
            <button onclick="uploadFile()">Upload & Process</button>

            <h3>Ask a Question</h3>
            <input type="text" id="questionInput" placeholder="Ask about your document...">
            <button onclick="askQuestion()">Ask</button>

            <div id="response"></div>
            <button onclick="logout()" style="background: red; margin-top:20px;">Logout</button>
        </div>
    </div>

    <script>
        let accessToken = localStorage.getItem('accessToken') || null;

        if (accessToken) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('response').innerText = "Session restored. Ready.";
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (!u || !p) {
                document.getElementById('response').innerText = "Please enter username and password.";
                return;
            }

            console.log('Attempting login for user:', u);

            try {
                const res = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                console.log('Login HTTP status:', res.status);

                const data = await res.json();
                console.log('Login response body:', data);

                // Save the token if the response contains one, regardless of res.ok
                if (data.access) {
                    accessToken = data.access;
                    localStorage.setItem('accessToken', accessToken);
                    console.log('TOKEN SAVED. First 30 chars:', accessToken.substring(0, 30));
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('app-section').classList.remove('hidden');
                    document.getElementById('response').innerText = "Logged in successfully!";
                } else {
                    document.getElementById('response').innerText = "Login failed. Server said: " + JSON.stringify(data);
                }
            } catch (err) {
                console.error('Login exception:', err);
                document.getElementById('response').innerText = "Login exception: " + err.message;
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return alert("Select a file");

            const currentToken = localStorage.getItem('accessToken');
            console.log('Upload using token:', currentToken ? currentToken.substring(0, 30) + '...' : 'NULL');

            if (!currentToken) {
                document.getElementById('response').innerText = "Not logged in. Please log out and log in again.";
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            document.getElementById('response').innerText = "Processing file...";

            try {
                const res = await fetch('/api/upload/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` },
                    body: formData
                });

                const data = await res.json();
                document.getElementById('response').innerText = data.message || data.error || JSON.stringify(data);
            } catch (err) {
                document.getElementById('response').innerText = "Upload error: " + err.message;
            }
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            if (!question) return;

            const currentToken = localStorage.getItem('accessToken');
            console.log('Query using token:', currentToken ? currentToken.substring(0, 30) + '...' : 'NULL');

            if (!currentToken) {
                document.getElementById('response').innerText = "Not logged in. Please log out and log in again.";
                return;
            }

            document.getElementById('response').innerText = "Thinking...";

            try {
                const res = await fetch('/api/query/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await res.json();
                document.getElementById('response').innerText = data.answer || data.error || data.detail || JSON.stringify(data);
            } catch (err) {
                document.getElementById('response').innerText = "Query error: " + err.message;
            }
        }

        function logout() {
            accessToken = null;
            localStorage.removeItem('accessToken');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('response').innerText = "";
        }
    </script>
</body>
</html>
